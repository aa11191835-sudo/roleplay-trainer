<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>禮儀專員情境訓練</title>
<style>
  :root {
    --primary: #22513A;
    --primary-light: #3A7059;
    --accent: #B08D4A;
    --bg: #F7F5EC;
    --card-bg: #FFFFFF;
    --text: #2A2A2A;
    --text-muted: #6B6B6B;
    --border: #E0DCC8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .app {
    width: 100%;
    max-width: 640px;
    background: var(--card-bg);
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.1);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: 560px;
  }
  .header {
    background: var(--primary);
    color: #fff;
    padding: 20px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .header h1 { font-size: 18px; margin: 0; font-weight: 600; }
  .header .badge { background: var(--accent); padding: 4px 10px; border-radius: 20px; font-size: 12px; }
  .body { flex: 1; padding: 28px 24px; display: flex; flex-direction: column; overflow-y: auto; }
  .choices { display: flex; flex-direction: column; gap: 14px; margin-top: 20px; }
  .choice-btn {
    background: var(--bg); border: 2px solid var(--border); border-radius: 12px;
    padding: 18px 20px; text-align: left; font-size: 16px; color: var(--text); cursor: pointer; transition: all 0.15s;
  }
  .choice-btn:hover { border-color: var(--primary); background: rgba(34,81,58,0.06); }
  .choice-btn .sub { display:block; font-size: 13px; color: var(--text-muted); margin-top: 4px; }
  .prompt-text { font-size: 16px; line-height: 1.7; margin-bottom: 4px; }
  .field-group { margin-top: 20px; display: flex; flex-direction: column; gap: 14px; }
  .field-group label { font-size: 14px; color: var(--text-muted); margin-bottom: 6px; display:block; }
  .field-group input {
    width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border);
    font-size: 15px; background: var(--card-bg); color: var(--text);
  }
  .chart-wrap { margin-top: 20px; }
  .bar-row { margin-bottom: 12px; }
  .bar-label { font-size: 14px; margin-bottom: 4px; display:flex; justify-content: space-between; }
  .bar-track { background: var(--border); border-radius: 6px; height: 18px; overflow: hidden; }
  .bar-fill { background: linear-gradient(90deg, var(--primary), var(--primary-light)); height: 100%; border-radius: 6px; transition: width 0.5s; }
  .tag-list { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
  .tag-item {
    border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; cursor: pointer;
    display: flex; justify-content: space-between; align-items: center;
  }
  .tag-item:hover { border-color: var(--accent); background: rgba(176,141,74,0.08); }
  .tag-item .name { font-weight: 600; font-size: 15px; }
  .tag-item .count { font-size: 12px; color: var(--text-muted); background: var(--bg); padding: 2px 8px; border-radius: 10px; }
  .btn-row { display:flex; gap: 10px; margin-top: 20px; }
  .btn { padding: 10px 18px; border-radius: 8px; border: none; cursor: pointer; font-size: 14px; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-secondary { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .scenario-box {
    background: rgba(176,141,74,0.1); border-left: 3px solid var(--accent); padding: 14px 16px;
    border-radius: 8px; font-size: 14px; line-height: 1.6; margin-bottom: 16px;
  }
  .chat-area { flex: 1; display: flex; flex-direction: column; }
  .messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 4px 0; margin-bottom: 12px; max-height: 320px; }
  .msg { max-width: 80%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.5; }
  .msg.family { align-self: flex-start; background: var(--bg); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .msg.rep { align-self: flex-end; background: var(--primary); color: #fff; border-bottom-right-radius: 4px; }
  .msg.system { align-self: center; font-size: 12px; color: var(--text-muted); font-style: italic; }
  .input-row { display: flex; gap: 8px; }
  .input-row input { flex: 1; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text); font-size: 14px; }
  .input-row button { background: var(--primary); color: #fff; border: none; border-radius: 10px; padding: 0 18px; cursor: pointer; }
  .back-link { font-size: 13px; color: var(--text-muted); cursor: pointer; margin-bottom: 8px; display: inline-block; }
  .footer-note { font-size: 12px; color: var(--text-muted); text-align:center; padding: 10px; border-top: 1px solid var(--border); }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1 id="header-title">禮儀專員情境訓練</h1>
    <span class="badge" id="header-badge">登入</span>
  </div>
  <div class="body" id="body"></div>
  <div class="footer-note">模擬對話由 AI 生成，僅供訓練演練參考，非真實家屬</div>
</div>

<script>
const TAG_DATA = [
  { l1: "迷信恐慌", l2: "過度擔憂禁忌", value: 4, hint: "家屬對禁忌極度敏感，反覆詢問各種日子時辰、方位是否會沖煞，稍有不確定就非常焦慮，甚至懷疑之前流程是否犯忌。" },
  { l1: "重視古禮", l2: "細節控", value: 4, hint: "家屬對傳統禮俗流程要求極度講究，會針對每個細節（如跪拜順序、服裝、供品擺放）反覆確認、要求完全按古禮，稍有疏漏就不滿。" },
  { l1: "弱勢家庭", l2: "社會局介入", value: 3, hint: "家庭經濟困難，需要申請社會局補助或協助，對費用非常敏感，也對流程手續不熟悉，需要更多說明與耐心引導。" },
  { l1: "加害與被害方衝突", l2: "靈堂維安高危險", value: 2, hint: "案件涉及加害方與被害方家屬可能同時出現在治喪期間，情緒對立、氣氛緊繃，禮儀人員需要謹慎維持現場秩序。" },
  { l1: "家族恩怨", l2: "治喪期間爆發", value: 2, hint: "家族成員間原本就有嫌隙或財產糾紛，治喪期間積怨爆發，可能當場爭吵，甚至波及對禮儀人員的態度。" },
  { l1: "陣頭排場導向", l2: "重視面子", value: 2, hint: "家屬非常重視喪禮排場與面子，希望陣頭、花藝、規格盡量盛大體面，會用「別人家都有的」來比較施壓。" },
  { l1: "主要家屬悲傷失能", l2: null, value: 1, hint: "主要決策的家屬因過度悲傷而情緒崩潰、難以正常對話或做決定，經常哭泣、恍神，需要極大的耐心與同理心引導。" },
  { l1: "司法相驗", l2: "流程不可控", value: 1, hint: "案件需要司法相驗，遺體與流程時程都不受家屬或禮儀公司控制，家屬對不確定的等待時間感到焦慮與不耐。" },
  { l1: "媒體關注", l2: "公眾人物案件", value: 1, hint: "往生者是公眾人物，喪禮受到媒體高度關注，家屬擔心隱私外洩，需要特別的隱私與現場管理考量。" },
  { l1: "孤獨過世", l2: "現場清理需求", value: 1, hint: "往生者獨居孤獨過世，家屬對現場清理與相關安排感到不知所措，情緒複雜（愧疚、悲傷交織）。" },
  { l1: "拒絕接受", l2: "強烈否認現實", value: 1, hint: "家屬無法接受親人離世的事實，言語中反覆否認「他不可能走了」，對治喪流程的討論感到抗拒或拖延。" },
  { l1: "新式環保", l2: null, value: 1, hint: "家屬希望採用環保葬（樹葬、海葬等）方式，對傳統流程有不同想法，需要說明環保葬的相關規定與流程。" },
  { l1: "未見最後一面", l2: "深重遺憾", value: 1, hint: "家屬因故未能見到往生者最後一面，充滿深深的遺憾與自責，情緒容易在對話中觸景傷情。" },
  { l1: "治喪決策權分散", l2: null, value: 1, hint: "沒有單一決策者，多位家屬對流程各有想法，意見不一致，禮儀人員需要協調溝通、避免各說各話。" },
  { l1: "白髮人送黑髮人", l2: null, value: 1, hint: "年邁父母為早逝子女辦理後事，情緒極度悲痛難以承受，是特別需要細膩同理心對待的情境。" },
  { l1: "跨世代信仰衝突", l2: null, value: 1, hint: "家族中長輩與晚輩對於宗教信仰看法不同（例如傳統道教 vs 基督教），對喪禮儀式該用哪種形式有分歧。" },
  { l1: "車禍意外", l2: "路祭與招魂需求", value: 1, hint: "往生者因車禍意外過世，家屬希望在事故現場進行路祭、招魂等民俗儀式，需要協調相關安排。" },
  { l1: "輕生案件", l2: "特殊民俗解煞", value: 1, hint: "案件較為特殊，家屬對相關民俗解煞儀式有需求，同時伴隨複雜且敏感的家族氣氛，請以尊重、不評判的態度陪伴溝通，聚焦於協助家屬完成合適的儀式安排。" },
  { l1: "靈異體質", l2: "特殊禁忌要求", value: 1, hint: "家屬提出各種特殊的禁忌或靈異相關要求（例如特定物品不能出現、特定人不能靠近），需要禮儀人員耐心理解並盡力配合或說明限制。" },
];
const COMMON_TAGS = TAG_DATA.filter(t => t.value >= 2);
const UNCOMMON_TAGS = TAG_DATA.filter(t => t.value === 1);

let state = { screen: "login" };
let chatMessages = [];

function tagLabel(t) { return t.l2 ? `${t.l1}－${t.l2}` : t.l1; }
function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function render() {
  const body = document.getElementById('body');
  const badge = document.getElementById('header-badge');
  body.innerHTML = '';

  if (state.screen === 'login') {
    badge.textContent = '登入';
    body.innerHTML = `
      <div class="prompt-text">開始訓練前，請先輸入您的資料：</div>
      <div class="field-group">
        <div><label>姓名</label><input type="text" id="input-name" placeholder="請輸入姓名"></div>
        <div><label>員工編號</label><input type="text" id="input-empid" placeholder="請輸入員工編號"></div>
      </div>
      <div class="btn-row"><button class="btn btn-primary" id="login-btn">開始訓練</button></div>
    `;
    document.getElementById('login-btn').addEventListener('click', () => {
      const name = document.getElementById('input-name').value.trim();
      const empId = document.getElementById('input-empid').value.trim();
      if (!name || !empId) { alert('請輸入姓名與員工編號'); return; }
      state = { screen: 'welcome', name, employeeId: empId };
      render();
    });
  }

  else if (state.screen === 'welcome') {
    badge.textContent = state.name;
    body.innerHTML = `
      <div class="prompt-text">歡迎，<b>${escapeHtml(state.name)}</b>。請選擇想要練習的情境類型：</div>
      <div class="choices">
        <button class="choice-btn" data-cat="common">常見問題<span class="sub">依歷史案例標籤分析，共 ${COMMON_TAGS.length} 種常見情境</span></button>
        <button class="choice-btn" data-cat="uncommon">不常見問題<span class="sub">共 ${UNCOMMON_TAGS.length} 種較少見但仍需準備的特殊情境</span></button>
      </div>
    `;
    body.querySelectorAll('.choice-btn').forEach(btn => {
      btn.addEventListener('click', () => { state.screen = 'chart'; state.category = btn.dataset.cat; render(); });
    });
  }

  else if (state.screen === 'chart') {
    const tags = state.category === 'common' ? COMMON_TAGS : UNCOMMON_TAGS;
    const maxVal = Math.max(...tags.map(t => t.value));
    badge.textContent = state.category === 'common' ? '常見問題' : '不常見問題';
    body.innerHTML = `
      <span class="back-link" id="back-btn">← 返回選擇</span>
      <div class="prompt-text">依 CRM 歷史案例統計，${state.category === 'common' ? '常見' : '不常見'}情境的標籤比例如下：</div>
      <div class="chart-wrap">
        ${tags.map(t => `<div class="bar-row"><div class="bar-label"><span>${tagLabel(t)}</span><span>${t.value} 件</span></div><div class="bar-track"><div class="bar-fill" style="width:${(t.value/maxVal*100)}%"></div></div></div>`).join('')}
      </div>
      <div class="btn-row"><button class="btn btn-primary" id="next-btn">下一步：選擇演練方式</button></div>
    `;
    document.getElementById('back-btn').addEventListener('click', () => { state.screen = 'welcome'; render(); });
    document.getElementById('next-btn').addEventListener('click', () => { state.screen = 'mode'; render(); });
  }

  else if (state.screen === 'mode') {
    badge.textContent = state.category === 'common' ? '常見問題' : '不常見問題';
    body.innerHTML = `
      <span class="back-link" id="back-btn">← 返回統計圖</span>
      <div class="prompt-text">請選擇演練方式：</div>
      <div class="choices">
        <button class="choice-btn" data-mode="individual">個別標籤演練<span class="sub">挑選單一情境標籤，針對性練習</span></button>
        <button class="choice-btn" data-mode="comprehensive">綜合演練<span class="sub">隨機組合多個情境，模擬更複雜的真實狀況</span></button>
      </div>
    `;
    document.getElementById('back-btn').addEventListener('click', () => { state.screen = 'chart'; render(); });
    body.querySelectorAll('.choice-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        state.mode = btn.dataset.mode;
        if (state.mode === 'individual') { state.screen = 'tagSelect'; render(); }
        else {
          const tags = state.category === 'common' ? COMMON_TAGS : UNCOMMON_TAGS;
          const shuffled = [...tags].sort(() => Math.random() - 0.5);
          state.selectedTags = shuffled.slice(0, Math.min(2, shuffled.length));
          startChat();
        }
      });
    });
  }

  else if (state.screen === 'tagSelect') {
    const tags = state.category === 'common' ? COMMON_TAGS : UNCOMMON_TAGS;
    badge.textContent = '選擇標籤';
    body.innerHTML = `
      <span class="back-link" id="back-btn">← 返回</span>
      <div class="prompt-text">請選擇要演練的標籤：</div>
      <div class="tag-list">${tags.map((t, i) => `<div class="tag-item" data-idx="${i}"><span class="name">${tagLabel(t)}</span><span class="count">${t.value} 件</span></div>`).join('')}</div>
    `;
    document.getElementById('back-btn').addEventListener('click', () => { state.screen = 'mode'; render(); });
    body.querySelectorAll('.tag-item').forEach(el => {
      el.addEventListener('click', () => { state.selectedTags = [tags[parseInt(el.dataset.idx)]]; startChat(); });
    });
  }

  else if (state.screen === 'chat') {
    badge.textContent = '演練中';
    const scenarioDesc = state.selectedTags.map(t => `【${tagLabel(t)}】${t.hint}`).join('\n');
    body.innerHTML = `
      <div class="chat-area">
        <div class="scenario-box"><b>情境設定：</b><br>${scenarioDesc.replace(/\n/g, '<br>')}</div>
        <div class="messages" id="messages"></div>
        <div class="input-row"><input type="text" id="chat-input" placeholder="輸入您（禮儀專員）的回應…"><button id="send-btn">送出</button></div>
        <div class="btn-row">
          <button class="btn btn-secondary" id="end-btn">結束演練並取得回饋</button>
          <button class="btn btn-secondary" id="restart-btn">重新開始</button>
        </div>
      </div>
    `;
    renderMessages();
    document.getElementById('send-btn').addEventListener('click', sendMessage);
    document.getElementById('chat-input').addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });
    document.getElementById('end-btn').addEventListener('click', endAndFeedback);
    document.getElementById('restart-btn').addEventListener('click', () => { const { name, employeeId } = state; state = { screen: 'welcome', name, employeeId }; chatMessages = []; render(); });
  }

  else if (state.screen === 'feedback') {
    badge.textContent = '訓練回饋';
    body.innerHTML = `
      <div class="prompt-text"><b>AI 回饋分析</b></div>
      <div class="scenario-box" id="feedback-box">分析中…</div>
      <div id="save-status" style="font-size:13px; color:var(--text-muted); margin-bottom:12px;"></div>
      <div class="btn-row"><button class="btn btn-primary" id="restart-btn">開始新的演練</button></div>
    `;
    document.getElementById('restart-btn').addEventListener('click', () => { const { name, employeeId } = state; state = { screen: 'welcome', name, employeeId }; chatMessages = []; render(); });
  }
}

function renderMessages() {
  const el = document.getElementById('messages');
  if (!el) return;
  el.innerHTML = chatMessages.map(m => {
    if (m.role === 'assistant') return `<div class="msg family">${escapeHtml(m.content)}</div>`;
    if (m.role === 'user') return `<div class="msg rep">${escapeHtml(m.content)}</div>`;
    return `<div class="msg system">${escapeHtml(m.content)}</div>`;
  }).join('');
  el.scrollTop = el.scrollHeight;
}

function buildSystemSetup() {
  const scenarioDesc = state.selectedTags.map(t => `【${tagLabel(t)}】${t.hint}`).join('\n');
  return `你正在協助訓練殯葬禮儀專員的溝通應對能力。請你完全代入一位正在治喪的「家屬」角色，情境設定如下：

${scenarioDesc}

請你：
1. 完全以這位家屬的身份、語氣與情緒說話，符合上述情境特徵
2. 根據禮儀專員的回應，做出符合真實情境的反應
3. 對話內容保持在治喪相關的溝通情境，不需要也不要涉及與死亡方式或事件本身無關的細節描寫
4. 每次回應保持簡短自然（1-3句話），像真實對話一樣
5. 不要出戲說明「我是AI」或「這是演練」，全程保持角色扮演

現在，請你以這位家屬的身份，開口說第一句話，向禮儀專員提出你的第一個問題或反應。`;
}

async function callChatAPI(history) {
  const res = await fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ history }),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || '呼叫失敗');
  return data.reply;
}

async function startChat() {
  state.screen = 'chat';
  chatMessages = [];
  render();
  chatMessages.push({ role: 'system', content: '對方正在輸入…' });
  renderMessages();
  try {
    const reply = await callChatAPI([{ role: 'user', text: buildSystemSetup() }]);
    chatMessages.pop();
    chatMessages.push({ role: 'assistant', content: reply });
    renderMessages();
  } catch (e) {
    chatMessages.pop();
    chatMessages.push({ role: 'system', content: '（發生錯誤，請重新開始演練）' });
    renderMessages();
  }
}

async function sendMessage() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  chatMessages.push({ role: 'user', content: text });
  renderMessages();
  chatMessages.push({ role: 'system', content: '對方正在輸入…' });
  renderMessages();
  try {
    const history = [
      { role: 'user', text: buildSystemSetup() },
      ...chatMessages.filter(m => m.role !== 'system').slice(1).map(m => ({ role: m.role, text: m.content })),
    ];
    const reply = await callChatAPI(history);
    chatMessages.pop();
    chatMessages.push({ role: 'assistant', content: reply });
    renderMessages();
  } catch (e) {
    chatMessages.pop();
    chatMessages.push({ role: 'system', content: '（發生錯誤，請稍後再試）' });
    renderMessages();
  }
}

async function endAndFeedback() {
  state.screen = 'feedback';
  render();

  if (chatMessages.filter(m => m.role === 'user').length === 0) {
    document.getElementById('feedback-box').textContent = '對話輪數不足，無法生成回饋，請先進行至少一輪對話。';
    return;
  }

  const transcript = chatMessages.filter(m => m.role !== 'system')
    .map(m => `${m.role === 'assistant' ? '家屬' : '禮儀專員'}：${m.content}`).join('\n');

  let feedbackText = '';
  try {
    const res = await fetch('/api/feedback', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ transcript }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    feedbackText = data.feedback;
    document.getElementById('feedback-box').textContent = feedbackText;
  } catch (e) {
    document.getElementById('feedback-box').textContent = '回饋生成失敗，請稍後再試。';
    return;
  }

  // 自動寫入 BizForm
  const statusEl = document.getElementById('save-status');
  statusEl.textContent = '正在儲存紀錄…';
  try {
    const saveRes = await fetch('/api/save-record', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: state.name,
        employeeId: state.employeeId,
        category: state.category === 'common' ? '常見' : '不常見',
        mode: state.mode === 'individual' ? '個別' : '綜合',
        tags: state.selectedTags.map(t => tagLabel(t)).join('、'),
        analysis: feedbackText,
      }),
    });
    const saveData = await saveRes.json();
    if (!saveRes.ok) throw new Error(saveData.error);
    statusEl.textContent = '✓ 紀錄已儲存至系統';
  } catch (e) {
    statusEl.textContent = '⚠ 紀錄儲存失敗：' + e.message;
  }
}

render();
</script>
</body>
</html>
